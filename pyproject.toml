[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "region_pj"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pycodestyle>=2.11",
]
notebook = [
    "matplotlib>=3.8",
    "torch>=2.0",
    "sparse-dot-mkl",
]
dev = [
    "pytest>=8.0",
    "pycodestyle>=2.11",
    "matplotlib>=3.8",
    "torch>=2.0",
    "sparse-dot-mkl",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
